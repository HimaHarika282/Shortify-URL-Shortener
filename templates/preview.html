<!DOCTYPE html>
<html>
<head>
<title>Redirecting - Shortify</title>

<style>

body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    position: relative;
}

/* LOGO */
.logo{
    position:absolute;
    top:40px;
    font-size:42px;
    font-weight:800;
    background: linear-gradient(90deg,#2563eb,#22c55e);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* CARD */
.card {
    background: white;
    padding: 35px;
    border-radius: 14px;
    text-align: center;
    width: 420px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h2 {
    margin-bottom: 10px;
    color: #111827;
}

.subtitle{
    color:#6b7280;
    margin-bottom:20px;
    font-size:14px;
}

/* URL BOX */
.url {
    color: #2563eb;
    word-break: break-all;
    margin: 15px 0;
    background:#f3f4f6;
    padding:12px;
    border-radius:8px;
    max-height:80px;
    overflow:auto;
    font-size:14px;
}

/* COUNTDOWN */
.countdown{
    margin-top:15px;
    color:#374151;
    font-size:15px;
}

/* BUTTONS */
.btn-group{
    margin-top:20px;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-size:14px;
    transition:0.2s;
}

.go-btn{
    background: #2563eb;
}

.go-btn:hover{
    background:#1d4ed8;
}

.cancel-btn{
    background:#ef4444;
    margin-left:10px;
}

.cancel-btn:hover{
    background:#dc2626;
}

</style>

</head>

<body>

<h1 class="logo">Shortify</h1>

<div class="card">

    <h2>Preview Destination</h2>

    <p class="subtitle">
        You are being redirected to:
    </p>

    <div class="url">
        {{ url }}
    </div>

    <div class="countdown">
        Redirecting in <span id="count">3 seconds</span>
    </div>

    <div class="btn-group">
        <button class="go-btn" onclick="goNow()">
            Go Now
        </button>

        <button class="cancel-btn" onclick="cancelRedirect()">
            Cancel
        </button>
    </div>

</div>

<script>

let count = 3;

const interval = setInterval(() => {

    count--;

    document.getElementById("count").innerText =
        count + (count === 1 ? " second" : " seconds");

    if(count === 0){

        clearInterval(interval);

        window.location.href = "{{ url }}";
    }

}, 1000);

function goNow(){

    window.location.href = "{{ url }}";
}

function cancelRedirect(){

    clearInterval(interval);

    fetch("/check-session", {
        credentials:"include"
    })

    .then(res => res.json())

    .then(data => {

        if(data.logged_in){
            window.location.href = "/dashboard";
        } else {
            window.location.href = "/login";
        }

    });
}

</script>

</body>
</html>
